<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XUI NAXX · Entrar</title><link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/bootstrap.css"><link rel="stylesheet" href="assets/app.css"><style>body{padding:0;min-height:100vh;display:flex;align-items:center;justify-content:center}.login-wrap{width:430px;max-width:calc(100% - 32px);padding:35px 0}.login-brand{text-align:center;margin-bottom:28px}.login-brand .logo{display:inline-flex}.login-card{padding:32px}.login-card h1{font-size:26px;font-weight:750;letter-spacing:-.03em}.login-card .form-control{min-height:46px;font-size:16px}.login-note{font-size:11px;line-height:1.7;color:var(--naxx-muted);margin-top:24px;text-align:center}.login-kicker{color:var(--naxx-accent);font-size:10px;letter-spacing:.15em;font-weight:700;margin:0 0 14px}.login-rule{border-top:1px solid var(--naxx-border);padding-top:18px;margin-top:24px;font-size:12px;text-align:center}.login-checkbox{display:flex;gap:9px;align-items:center;font-size:12px;color:var(--naxx-muted);margin:18px 0}.login-checkbox input{accent-color:var(--naxx-accent);height:18px;width:18px}.login-submit{width:100%;min-height:47px}#login-feedback{font-size:12px;min-height:20px;margin-top:12px}@media(max-width:420px){.login-card{padding:24px}}</style></head><body class="authentication-bg"><main class="login-wrap"><div class="login-brand"><a class="logo" href="index.html" aria-label="XUI NAXX"></a></div><div class="card login-card"><p class="login-kicker">BEM-VINDO DE VOLTA</p><h1>Acesse seu painel</h1><p class="text-muted mb-4">Seu conteúdo. Seu controle. Seu NAXX.</p><form id="demo-login"><label for="username">Usuário</label><input id="username" class="form-control mb-3" value="admin" autocomplete="off" required><label for="password">Senha de demonstração</label><input id="password" class="form-control" type="password" value="naxx-demo" autocomplete="off" required><label class="login-checkbox"><input type="checkbox" checked>Manter o usuário preenchido nesta demonstração</label><button class="btn btn-primary login-submit" type="submit">Entrar no painel <span style="margin-left:12px">→</span></button><p id="login-feedback" class="text-danger" role="alert"></p></form><div class="login-rule"><span class="naxx-live-dot"></span>Prévia local · dados simulados</div></div><p class="login-note">Demonstração: <strong>admin</strong> / <strong>naxx-demo</strong><br>Esta tela não autentica no XUI real. Não use sua senha real.<br>Português brasileiro · XUI NAXX</p></main><script>document.getElementById('demo-login').addEventListener('submit',function(event){event.preventDefault();if(document.getElementById('username').value==='admin'&&document.getElementById('password').value==='naxx-demo')location.href='index.html';else document.getElementById('login-feedback').textContent='Use admin e naxx-demo para acessar a demonstração.';});</script></body></html>
